server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;

    # 前端静态资源（Windows 上 npm run build 生成的 dist 目录）
    # 部署时改成实际路径，例如 /opt/indicator/dist
    root /opt/indicator/dist;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    location / {
        # SPA 回退：路由用 createWebHistory，刷新非首页路径必须回落到 index.html
        try_files $uri $uri/ /index.html;

        # html 不缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            etag off;
            if_modified_since off;
        }

        # 静态资源长期缓存（vite 产物文件名带 hash，可放心 immutable）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 后端 API 反向代理，转发给 uvicorn 8800
    # 注意：后端路由本身带 /api 前缀（app.main.py 中 include_router(prefix="/api")），
    # 所以 proxy_pass 后面不要加 "/"，否则 /api 会被剥掉导致 404
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 跑批、SQL 试算可能较慢，适当放宽超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 本项目没有 websocket 接口，若以后新增再启用
    # location /ws {
    #     proxy_pass http://127.0.0.1:8800;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }
}
